# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog

[versions]
guava = "33.5.0-jre"
junit = "4.13.2"
netty = "4.2.17.Final"
hytale-server = "0.6.0-pre.11"
bouncycastle = "1.85"
slf4j = "2.0.18"
logback = "1.5.38"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit = { module = "junit:junit", version.ref = "junit" }
hytale-server = { module = "com.hypixel.hytale:Server", version.ref = "hytale-server" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Netty: the BOM aligns every netty-* module, so the rest are declared without a version.
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-codec-quic = { module = "io.netty:netty-codec-classes-quic" }
netty-codec-quic-native = { module = "io.netty:netty-codec-native-quic" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
ginco-hygradle = { id = "gg.ginco.hygradle" }
