# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog

[versions]
guava = "33.5.0-jre"
junit = "4.13.2"
mockito = "5.24.0"
netty = "4.2.17.Final"
hytale-server = "0.7.0-pre.5.1"
assertj = "3.27.7"
bouncycastle = "1.85"
slf4j = "2.0.18"
logback = "1.5.38"
fastutil = "8.5.19"
nimbus-jose-jwt = "10.9.1"
spotless = "8.10.2"
shadow = "9.6.1"
okaeri-configs = "6.1.0-beta.4"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit = { module = "junit:junit", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
hytale-server = { module = "com.hypixel.hytale:Server", version.ref = "hytale-server" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Netty: the BOM aligns every netty-* module, so the rest are declared without a version.
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-codec-quic = { module = "io.netty:netty-codec-classes-quic" }
netty-codec-quic-native = { module = "io.netty:netty-codec-native-quic" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Swap to it.unimi.dsi:fastutil-core (6 MB vs 22 MB) if int/long/double/object
# specializations are all this ends up needing.
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
okaeri-configs-yaml = { module = "eu.okaeri:okaeri-configs-yaml-snakeyaml", version.ref = "okaeri-configs" }
okaeri-configs-validator = { module = "eu.okaeri:okaeri-configs-validator-okaeri", version.ref = "okaeri-configs" }

[plugins]
ginco-hygradle = { id = "gg.ginco.hygradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
